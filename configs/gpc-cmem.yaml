# A cluster of the 2p family with a cluster memory tier: one cmem SRAM block
# per cluster (5b item 2). Weight blocks placed in cmem stream from it
# instead of HBM. Placement is free: no step-0 preload is charged. The SMs
# are listed by the including file.

# SMEM keeps data (router outputs, activations); HBM (the device) is null:
# weights have no values, and a DMA from HBM copies nothing.
fidelity: numeric
fabric:
  # Crossbar 512 B/cycle: four SM bridges at full rate.
  - {name: CSBUS, topology: xbar, bw_bytes: 512}
memory:
  # cmem is L2-class SRAM: port 1024 B/cycle (2x the 512 B/cycle of the four
  # SM bridges), latency 30 cycles, 64 MiB (2p-cmem-large.yaml: 1.5 GiB).
  - {name: cmem, type: scratch, addr: [[0x0, 0x4000000]], bw_bytes: 1024, latency: 30,
     slave: $this.CSBUS}
  - {name: sync, type: sync, addr: [[0x1F0000000, 0x1F1000000]]}
compute:
  # Copy engine: every write into cmem is a task of the cluster on it, a
  # pull from the writing SM (Section 3.3).
  - {name: dma, type: dma, latency: 100, inflight: 8, outstanding: 4, master: $this.CSBUS}
# The cluster owns cmem, so every write into cmem is its task. Table sizes
# as at the SMs (sm.yaml), except the version table: 1024, one entry per
# cmem output block in flight (as at the device, 2p.yaml).
neutrino: {scoreboard: 128, pending: 256, execution: 256, versions: 1024, inbound_refs: 128, inbound_invokes: 64, outbound_deps: 128, outbound_invokes: 32}
