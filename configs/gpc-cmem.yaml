# gpc.yaml plus a cluster memory tier: one cmem SRAM block of 64 MiB
# (2p-cmem-large.yaml: 1.5 GiB) on the data crossbar.

bridge: {data: $parent.sbus, control: $parent.cbus, bw_bytes: 256, latency: 20}
fidelity: numeric
fabric:
  - {name: clsbus, topology: xbar, bw_bytes: 512}
  - {name: clcbus, topology: xbar, bw_bytes: 64, control: true}
memory:
  - {name: hbm, type: dram, addr: [[0x0, 0xF0000000]], bw_bytes: 512, latency: 200,
     slave: $this.clsbus}
  # cmem is L2-class SRAM: port 1024 B/cycle (2x the 512 B/cycle of the four
  # SM bridges), latency 30 cycles, 64 MiB, above the HBM slice.
  - {name: cmem, type: scratch, addr: [[0x100000000, 0x104000000]], bw_bytes: 1024, latency: 30,
     slave: $this.clsbus}
  - {name: sync, type: sync, addr: [[0x1F0000000, 0x1F1000000]]}
compute:
  # Copy engine: every write into the slice or the cmem is a task of the
  # gpc on it.
  # Beat 512 B: sized to the bus it masters (clsbus, 512 B/cycle).
  - {name: dma, type: dma, latency: 100, inflight: 8, outstanding: 4, beat_bytes: 512, master: [$this.clsbus]}
neutrino: {scoreboard: 128, pending: 256, execution: 256, versions: 1024, inbound_refs: 128, inbound_invokes: 64, outbound_deps: 128, outbound_invokes: 32}
children:
  - {name: sm0, config: sm.yaml}
  - {name: sm1, config: sm.yaml}
  - {name: sm2, config: sm.yaml}
  - {name: sm3, config: sm.yaml}
