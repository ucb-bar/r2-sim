# RTX PRO 6000 Blackwell Workstation Edition (GB202) as a Radiance 2 device:
# the correlation reference (r2sim spec Section 13.3). Caches are modeled
# as scratch memories of the same capacity at the same place: the L2 is a
# 128 MB scratch of 64 contiguous physical slices behind the device
# crossbar, reached through a link that carries the address hash, and
# each SM's L1/shared block is its smem. Data is where the programs put it.
#
# Physical configuration (2026-10-14, slots model, r2sim spec Sections
# 5.2 and 5.6): every value is a hardware number or the result of a test that
# isolates it; none is set to make another test match. One cycle is an SM
# cycle. The card was measured with its clocks locked by NCU at the boost
# point: SM 2.61 GHz, L2 2.29 GHz (7/8 of the SM clock), GDDR7 13.35 GHz
# (5.1 times); microbenchmark suites 6 (clock domains) and 8 on the card.
#
# Ownership: the root owns the L2 and the GDDR7 (the GPU has one crossbar
# and no NUMA), so every dependency on them registers at the root Neutrino;
# its tables are sized accordingly. Programs address the linear ranges of
# the hash links; the physical slice and channel ranges are where the
# blocks sit. Own spaces: offset_bits 38 (256 GiB per node); fields gpc:4,
# sm:5.
#   root          L2 linear at 0x0 (128 MiB), physical at 4 GiB; sync at
#                 0x1F0000000; GDDR7 linear at 32 GiB (96 GiB), physical at 128 GiB
#   gpc g         (g + 1) << 43: its sync space
#   gpc g, SM s   ((g + 1) << 43) | ((s + 1) << 38): its smem and sync space
#
# Not modeled (recorded): the data in flight per GPC, which limits the
# card's GPC read rate (rtx6000-gpc.yaml); DRAM traffic does not pass
# through the L2 slice ports (each slice fronts its channels on the card);
# a random dependent load from the GDDR7 (the card adds about 550 cycles to
# an L2 hit); the card's remote SMEM in a cluster (DSMEM);
# MIG is off; 192 SMs stand for 188.

global:
  neutrino_granule: 128     # warp tiles with 128 B rows (2026-10-21)
  clock_ghz: 2.617
  msg_bytes: 64
  flow: readyvalid
  hop_queue: 1
  address:
    fields: [{name: gpc, bits: 4}, {name: sm, bits: 5}]
    offset_bits: 38

device:
  name: root
  fabric:
    # The device crossbar: the GPC links, the two hash links and the
    # Neutrino as ports. Unlimited: no limit of its own is observed (all
    # SMs read 3,199 B/cycle, under the slices' 3,584 and the GPC links'
    # 3,312). l2bus and mbus carry the physical traffic to the slices and
    # the channels; they are unlimited.
    - {name: sbus, topology: xbar}
    - {name: cbus, topology: xbar, bw_bytes: 64, control: true}
    - {name: l2bus, topology: xbar}
    - {name: mbus, topology: xbar}
    # The L2 address hash (Radiance 2 spec Section 3.3): linear [128 MiB, 256
    # MiB) to the 64 physical slices at 4 GiB (not at 0: no node owns the
    # null address, 2026-10-20; the index bits are 8 to 20, so the slices
    # and offsets are those of [0, 128 MiB)). Slice index bit j is the parity
    # of the address ANDed with index[j] (the measured hash over bits 8 to
    # 20: index bit 0 = a8 ^ a14 ^ a17 ^ a19 ^ a20, and so on); the offset
    # inside the slice is the linear address with the `drop` bits removed.
    # Zero latency: the hash is part of the crossbar's address decode.
    - {name: sbus_to_l2bus, topology: link, from: $this.sbus, to: $this.l2bus, latency: 0,
       hash: {range: [0x8000000, 0x10000000], to_range: [0x100000000, 0x108000000],
              index: [0x1A4100, 0x1F0400, 0x190800, 0x1F5000, 0x136000, 0x1A8000],
              drop: [8, 10, 11, 12, 13, 15]}}
    # The GDDR7 channel interleave: linear [32 GiB, 128 GiB) to 64 channels
    # of 1.5 GiB at 128 GiB. On the card each L2 slice fronts its own
    # channels, so a line's channel follows its slice: the L2's measured
    # slice hash picks the channel too (2026-10-15; before, a plain
    # 256 B stripe, unmeasured, which put pieces of rows that start on the
    # same channel group on the same few channels).
    - {name: sbus_to_mbus, topology: link, from: $this.sbus, to: $this.mbus, latency: 0,
       hash: {range: [0x800000000, 0x2000000000], to_range: [0x2000000000, 0x3800000000],
              index: [0x1A4100, 0x1F0400, 0x190800, 0x1F5000, 0x136000, 0x1A8000],
              drop: [8, 10, 11, 12, 13, 15]}}
  memory:
    # L2: 64 contiguous physical slices (banks) of 2 MiB on the L2 clock,
    # 7/8 of the SM clock (measured 0.874 at the boost lock point). Per L2
    # cycle a slice reads 64 B (NCU's peak: 4,096 B per L2 cycle over 64
    # slices) and writes 32 B (all SMs write 1,941 B per L2 cycle, 94 % of
    # 64 x 32, on the L2 clock at both lock points), in 32 B beats (one
    # sector). Latency 142 SM cycles: the 124 L2 cycles of an L2 hit that
    # scale with the L2 clock (the hit costs 307.5 SM cycles with SM 1.588 /
    # L2 2.068 GHz and 354.0 with 2.614 / 2.286).
    # Experiment (2026-10-15, sim-core sim::cache): the L2 caches the GDDR7,
    # 256 B lines (the channel stripe), slice c fronts channel c.
    - {name: l2, type: scratch, addr: [[0x100000000, 0x108000000]], banks: 64,
       bw_bytes: 64, wr_bytes: 32, beat_bytes: 32, clock: 7/8, latency: 142, slave: $this.l2bus,
       cache: {of: $this.hbm, line_bytes: 256}}
    # GDDR7: 96 GiB over 16 devices of 32 bits, each four independent 8-bit
    # channels: 64 channels of 2 B per DRAM cycle (NCU's peak: 128 B per
    # DRAM cycle, 1,709 GB/s) on the DRAM clock, 51/10 of the SM clock
    # (13.35 GHz against 2.617; the card's GDDR7 rates are fixed in GB/s at
    # both lock points). 32 B beats: the channels deliver whole sectors.
    # Read and write share a channel. Latency 142, the L2's
    # (2026-10-13): a copy issued ahead acts as a prefetch, and on the card a
    # sequential bulk copy from the GDDR7 takes the same time as one from
    # the L2; a random dependent load would see about 550 cycles more.
    # Named hbm for the builders; programs use the linear range of
    # sbus_to_mbus.
    - {name: hbm, type: dram, addr: [[0x2000000000, 0x3800000000]], banks: 64,
       bw_bytes: 2, beat_bytes: 32, clock: 51/10, latency: 142, slave: $this.mbus}
    - {name: sync, type: sync, addr: [[0x1F0000000, 0x1F1000000]]}
  compute:
    # A copy engine at the device. In Radiance 2 a write into the L2 or the
    # GDDR7 is a pull by the owner's engine; on the card the SMs store
    # directly. This engine stands for those stores and must not be a
    # limit: 64 transfers in flight, 512 B beats, latency 40 (a stand-in,
    # not a hardware number).
    - {name: dma, type: dma, latency: 40, inflight: 64, beat_bytes: 512, master: [$this.sbus]}
  # versions: the card has no version table; 1,048,576 entries so that it
  # cannot limit a run (2026-10-15).
  neutrino: {scoreboard: 1024, pending: 4096, execution: 4096, versions: 1048576, inbound_refs: 1024, inbound_invokes: 256, outbound_deps: 256, outbound_invokes: 64}
  children:
    - {name: gpc0, config: rtx6000-gpc.yaml}
    - {name: gpc1, config: rtx6000-gpc.yaml}
    - {name: gpc2, config: rtx6000-gpc.yaml}
    - {name: gpc3, config: rtx6000-gpc.yaml}
    - {name: gpc4, config: rtx6000-gpc.yaml}
    - {name: gpc5, config: rtx6000-gpc.yaml}
    - {name: gpc6, config: rtx6000-gpc.yaml}
    - {name: gpc7, config: rtx6000-gpc.yaml}
    - {name: gpc8, config: rtx6000-gpc.yaml}
    - {name: gpc9, config: rtx6000-gpc.yaml}
    - {name: gpc10, config: rtx6000-gpc.yaml}
    - {name: gpc11, config: rtx6000-gpc.yaml}
