# One SM of the RTX PRO 6000 Blackwell (GB202) reference configuration
# (r2sim spec Section 13.3). One cycle is an SM cycle; the card's numbers
# are from microbenchmarks with the clocks locked by NCU at the boost point
# (SM 2.61 GHz, L2 2.29 GHz; microbenchmark suite 8 on the card, 2026-10-14).
# Every value is a hardware number or the result of a test that isolates
# it; none is set to make another test match.
#
# * Link to the gpc crossbar: 32 B/cycle per direction in 32 B beats (one
#   sector per cycle). One SM reads 32.0 B/cycle from the L2 and from the
#   GDDR7, the same per SM cycle at both lock points, so the link is on the
#   SM clock. Latency 27 cycles: an L2 hit costs 354 SM cycles at the boost
#   point, of which 124 L2 cycles (142 SM cycles) are the slice's (the two
#   lock points separate them) and 49 are the SM's own load path (an L1
#   hit); the other 163 are the fabric, both ways: 81 per direction, split
#   1:2 between this link and the GPC link (the split is not measured).
# * smem: the 128 KB L1/shared block at 128 B/cycle in 32 B beats (8 B
#   loads, ldmatrix and 16 B stores reach 128; 4 B and 16 B loads 64).
#   Latency 34 cycles (a dependent ld.shared).
# * atlas0 to atlas3: the four tensor cores, one per sub-partition (a warp
#   runs on the sub-partition w mod 4), each a quarter of the SM's dense
#   MAC per cycle: bf16 128, fp8 256, fp4 512 (mma.sync from registers on
#   all four: 511.8, 1023.6, 2047 per SM). acc_buffer is per unit (the
#   sub-partition's registers; --acc-buffer sets every unit's).
# * muon: the 128 CUDA cores as a 128-lane vector unit (125 fp32 FMA per
#   cycle measured); overhead 20 cycles per task (not measured).
# * dma: the SM's bulk copy engine (TMA). Latency 208 cycles, the one
#   calibrated parameter of the copy path: a 1 KiB copy from the L2 takes
#   the card's 550 cycles. The TMA unit's own time; the request's way to
#   the L2 (81 cycles) is the model's request leg since 2026-10-21 (the
#   calibrated total was 289 before). The other copy sizes are
#   predictions.
#   8 transfers in flight; 32 B beats.
# * neutrino: the Radiance 2 tables as in sm.yaml; the GPU has no such unit.

fabric:
  - {name: smsbus, topology: xbar}
  - {name: smcbus, topology: xbar, control: true}
  - {name: lbus, topology: xbar}
  - {name: smsbus_to_clsbus, topology: link, from: $this.smsbus, to: $parent.clsbus, bw_bytes: 32, beat_bytes: 32, latency: 27}
  - {name: smcbus_to_clcbus, topology: link, from: $this.smcbus, to: $parent.clcbus, bw_bytes: 32, beat_bytes: 32, latency: 27, control: true}
memory:
  - {name: smem, type: scratch, addr: [[0x0, 0x20000]], bw_bytes: 128, beat_bytes: 32, latency: 34,
     slave: [$this.lbus, $this.smsbus]}
  - {name: sync, type: sync, addr: [[0x1F0000000, 0x1F1000000]]}
compute:
  - {name: atlas0, type: tensor, rate: {bf16: 128, fp8: 256, mxfp4: 512},
     quantize: tile, operand_reuse: none, acc_buffer: 0, master: [$this.lbus]}
  - {name: atlas1, type: tensor, rate: {bf16: 128, fp8: 256, mxfp4: 512},
     quantize: tile, operand_reuse: none, acc_buffer: 0, master: [$this.lbus]}
  - {name: atlas2, type: tensor, rate: {bf16: 128, fp8: 256, mxfp4: 512},
     quantize: tile, operand_reuse: none, acc_buffer: 0, master: [$this.lbus]}
  - {name: atlas3, type: tensor, rate: {bf16: 128, fp8: 256, mxfp4: 512},
     quantize: tile, operand_reuse: none, acc_buffer: 0, master: [$this.lbus]}
  - {name: muon, type: vector, rate: {lane_op: 128}, overhead: 20, master: [$this.lbus, $this.smsbus]}
  - {name: dma, type: dma, latency: 208, inflight: 8, beat_bytes: 32, master: [$this.lbus, $this.smsbus]}
neutrino: {scoreboard: 128, pending: 256, execution: 256, versions: 256, inbound_refs: 128, inbound_invokes: 64, outbound_deps: 128, outbound_invokes: 32,
           c_invoke: 8, master: [$this.smcbus, $this.lbus, $this.smsbus]}
