# The MIG 2g.48gb half of the RTX PRO 6000 Blackwell (rtx6000.yaml): half
# the SMs (94 on the card; 6 GPCs x 16 here), half the memory controllers
# (8 devices, 32 GDDR7 channels), half the L2 (64 MB, 32 slices), 48 GB.
# Every block as in rtx6000.yaml (physical values of 2026-10-14: L2 slices
# 64 / 32 B per L2 cycle at clock 7/8, GDDR7 channels 2 B per DRAM cycle at
# 51/10, latencies 142). The slice hash of a MIG instance is unmeasured:
# the full card's hash with the top index bit (address bit 15) dropped is
# assumed. MIG is off on the measured card, so this half is not measured.

global:
  neutrino_granule: 128     # warp tiles with 128 B rows (2026-10-21)
  clock_ghz: 2.617
  msg_bytes: 64
  flow: readyvalid
  hop_queue: 1
  address:
    fields: [{name: gpc, bits: 4}, {name: sm, bits: 5}]
    offset_bits: 38

device:
  name: root
  fabric:
    - {name: sbus, topology: xbar}
    - {name: cbus, topology: xbar, bw_bytes: 64, control: true}
    - {name: l2bus, topology: xbar}
    - {name: mbus, topology: xbar}
    # The full card's hash without its top index bit (address bit 15).
    # Linear [64 MiB, 128 MiB): no node owns the null address (2026-10-20).
    - {name: sbus_to_l2bus, topology: link, from: $this.sbus, to: $this.l2bus, latency: 0,
       hash: {range: [0x4000000, 0x8000000], to_range: [0x100000000, 0x104000000],
              index: [0x1A4100, 0x1F0400, 0x190800, 0x1F5000, 0x136000],
              drop: [8, 10, 11, 12, 13]}}
    # 32 channels of 1.5 GiB: linear [32 GiB, 80 GiB) to physical at
    # 128 GiB. A line's channel follows its slice, as in rtx6000.yaml: the
    # slice hash above picks the channel too (2026-10-15).
    - {name: sbus_to_mbus, topology: link, from: $this.sbus, to: $this.mbus, latency: 0,
       hash: {range: [0x800000000, 0x1400000000], to_range: [0x2000000000, 0x2C00000000],
              index: [0x1A4100, 0x1F0400, 0x190800, 0x1F5000, 0x136000],
              drop: [8, 10, 11, 12, 13]}}
  memory:
    - {name: l2, type: scratch, addr: [[0x100000000, 0x104000000]], banks: 32,
       bw_bytes: 64, wr_bytes: 32, beat_bytes: 32, clock: 7/8, latency: 142, slave: $this.l2bus}
    - {name: hbm, type: dram, addr: [[0x2000000000, 0x2C00000000]], banks: 32,
       bw_bytes: 2, beat_bytes: 32, clock: 51/10, latency: 142, slave: $this.mbus}
    - {name: sync, type: sync, addr: [[0x1F0000000, 0x1F1000000]]}
  compute:
    - {name: dma, type: dma, latency: 40, inflight: 64, beat_bytes: 512, master: [$this.sbus]}
  # versions: the card has no version table; 1,048,576 entries so that it
  # cannot limit a run (2026-10-15).
  neutrino: {scoreboard: 1024, pending: 4096, execution: 4096, versions: 1048576, inbound_refs: 1024, inbound_invokes: 256, outbound_deps: 256, outbound_invokes: 64}
  children:
    - {name: gpc0, config: rtx6000-gpc.yaml}
    - {name: gpc1, config: rtx6000-gpc.yaml}
    - {name: gpc2, config: rtx6000-gpc.yaml}
    - {name: gpc3, config: rtx6000-gpc.yaml}
    - {name: gpc4, config: rtx6000-gpc.yaml}
    - {name: gpc5, config: rtx6000-gpc.yaml}
