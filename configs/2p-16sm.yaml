# 2p.yaml with four gpcs of 4 SMs (16 SMs; the SM-count axis of the
# sensitivity sweep): four HBM slices of 4 GiB at 512 B/cycle each.

global:
  neutrino_granule: 512    # Neutrino2 range alignment
  clock_ghz: 1.0
  msg_bytes: 64            # one beat of a protocol message
  flow: readyvalid         # ready/valid channels (Section 3.3)
  hop_queue: 1             # messages per hop stage and class (a pipeline register)
  address:
    fields: [{name: gpc, bits: 3}, {name: sm, bits: 3}]
    offset_bits: 33

device:
  name: root
  fabric:
    # Data between the gpcs: 1024 B/cycle per port.
    - {name: sbus, topology: xbar, bw_bytes: 1024, wr_bytes: 1024}
    # Control between the gpcs: 64 B/cycle per port, one beat per cycle.
    - {name: cbus, topology: xbar, bw_bytes: 64, control: true}
  memory:
    - {name: sync, type: sync, addr: [[0x1F0000000, 0x1F1000000]]}
  neutrino: {scoreboard: 128, pending: 256, execution: 256, versions: 256, inbound_refs: 128, inbound_invokes: 64, outbound_deps: 128, outbound_invokes: 32}
  children:
    - {name: gpc0, config: gpc.yaml}
    - {name: gpc1, config: gpc.yaml}
    - {name: gpc2, config: gpc.yaml}
    - {name: gpc3, config: gpc.yaml}
