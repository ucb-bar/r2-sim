# 2p.yaml with 2 MiB of SMEM per SM (the 5b item 3b target size) and an SMEM
# read port and write port of 512 B/cycle each (H2: the rate the Atlas needs
# for bf16 operands, 128 A plus 128 B elements per cycle of K; 2p.yaml has
# 256 each).
base: 2p.yaml
set:
  - "root.gpc*.sm*.smem.addr=[[0x0, 0x200000]]"
  - root.gpc*.sm*.smem.bw_bytes=512
  - root.gpc*.sm*.smem.wr_bytes=512
