# A gpc of the 2p family without cmem: two crossbars (data and control),
# its HBM slice with a copy engine, and four SMs (sm.yaml), addressed
# root.gpcN.sm0 .. sm3.

# Data bridge to the device: 256 B/cycle each way, latency 20 cycles.
# SMEM keeps data (router outputs, activations); HBM has no values:
# weights have no values, and a DMA from HBM copies nothing.
fidelity: numeric
fabric:
  # Data crossbar 512 B/cycle: four SM links at full rate, and the HBM
  # slice. The data crossbar and data link have separate read and write
  # channels at the read rate (architecture Section 3.5).
  - {name: clsbus, topology: xbar, bw_bytes: 512, wr_bytes: 512}
  # Control crossbar 8 B/cycle per port (2026-10-20): a 64 B
  # message beat takes 8 cycles on each control hop.
  - {name: clcbus, topology: xbar, bw_bytes: 8, beat_bytes: 8, control: true}
  # Links to the device, latency 20: data 256 B/cycle per direction; control
  # 8 B/cycle per direction (2026-10-20).
  - {name: clsbus_to_sbus, topology: link, from: $this.clsbus, to: $parent.sbus, bw_bytes: 256, wr_bytes: 256, latency: 20}
  - {name: clcbus_to_cbus, topology: link, from: $this.clcbus, to: $parent.cbus, bw_bytes: 8, beat_bytes: 8, latency: 20, control: true}
memory:
  # The gpc's HBM slice (NUMA, architecture Section 8.2): 4 GiB (one
  # address set), half of the 8 GiB of the 2p device; 512 B/cycle at 1 GHz, about the per-GPC
  # share of a GB200-class part (8 TB/s over 16 GPCs); latency 200 cycles:
  # DRAM access plus controller.
  - {name: hbm, type: dram, addr: [[0x0, 0x100000000]], bw_bytes: 512, latency: 200,
     slave: $this.clsbus}
  - {name: sync, type: sync, addr: [[0x1F0000000, 0x1F1000000]]}
compute:
  # Copy engine: every write into the slice is a task of the gpc on it, a
  # pull from the writing SM (Section 3.3); 8 transfers in flight, chunks
  # issued at the beat rate (see sm.yaml). No burst_bytes.
  # Beat 512 B: sized to the bus it masters (clsbus, 512 B/cycle).
  - {name: dma, type: dma, latency: 100, inflight: 8, beat_bytes: 512, master: [$this.clsbus]}
# Version table 1024: one entry per HBM output block in flight (up to 896
# per window with the current write granularity, one DMA per 128-column
# block per token tile).
neutrino: {scoreboard: 128, pending: 256, execution: 256, versions: 1024, inbound_refs: 128, inbound_invokes: 64, outbound_deps: 128, outbound_invokes: 32}
children:
  - {name: sm0, config: sm.yaml}
  - {name: sm1, config: sm.yaml}
  - {name: sm2, config: sm.yaml}
  - {name: sm3, config: sm.yaml}
