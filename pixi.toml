[workspace]
name = "r2-sim"
description = "Radiance 2 simulator: Rust discrete-event model, Python analysis tools"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
rust = ">=1.85"
python = "3.12.*"
numpy = ">=2"
matplotlib = ">=3.9"
pandas = ">=2.2"
ml_dtypes = ">=0.5.4,<0.6"
safetensors = ">=0.8.0,<0.9"
pytest = ">=9.1.1,<10"
clang = "22.1.8.*"
lld = "22.1.8.*"

# PyTorch on the CPU for the provider `torch` of the Python plug-in: an
# optional environment (`pixi run -e torch ...`); the default environment
# has no PyTorch.
[feature.torch.dependencies]
pytorch = { version = ">=2.5", build = "cpu_*" }

[environments]
torch = ["torch"]

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/python"

[tasks]
build = "cargo build --release"
# The Python plug-in (libr2_python.so, next to r2sim): not in the default
# build, it runs the Python of this environment.
build-python = "cargo build --release -p r2-python"
test = { cmd = "cargo test --release && python -m pytest -q python/tests", depends-on = ["build", "build-python"] }
check = "cargo clippy --release --all-targets -- -D warnings"
fmt = "cargo fmt --all"
golden = { cmd = "tools/golden.sh", depends-on = ["build"] }
