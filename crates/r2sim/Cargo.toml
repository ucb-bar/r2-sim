[package]
name = "r2sim"
description = "Radiance 2 simulator command line: run a program on a configuration, write JSON stats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nu-model = { path = "../nu-model", features = ["serde"] }
sim-core = { path = "../sim-core" }
func = { path = "../func" }
nu-prog = { path = "../nu-prog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = "0.13"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
zstd = "0.13.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
