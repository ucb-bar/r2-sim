# An SM of tiny.yaml. The control link runs at 1/8 of the data link's
# rate (4 B/cycle).
# The hand-computed tests on this file exclude descriptor assembly:
# every Neutrino has c_base, c_dep and c_word 0 (c_invoke only).
fabric:
  - {name: smsbus}
  - {name: smcbus, control: true}
  - {name: lbus}
  - {name: smsbus_to_clsbus, topology: link, from: $this.smsbus, to: $parent.clsbus, bw_bytes: 32, latency: 10}
  - {name: smcbus_to_clcbus, topology: link, from: $this.smcbus, to: $parent.clcbus, bw_bytes: 4, latency: 10, control: true}
memory:
  - {name: smem, type: scratch, addr: [[0x0, 0x100000]], bw_bytes: 128, latency: 10, slave: [$this.lbus, $this.smsbus]}
  - {name: sync, type: sync, addr: [[0xF00000, 0x1000000]]}
compute:
  - {name: atlas, type: tensor, rate: {bf16: 4096, fp8: 4096, mxfp4: 4096}, quantize: none,
     master: [$this.lbus]}
  - {name: muon, type: vector, rate: {lane_op: 64}, overhead: 10, master: [$this.lbus, $this.smsbus]}
  - {name: dma, type: dma, latency: 50, inflight: 2, outstanding: 1, master: [$this.lbus, $this.smsbus]}
neutrino: {scoreboard: 64, execution: 64, pending: 16, inbound_refs: 16, outbound_deps: 16, outbound_invokes: 16, c_base: 0, c_dep: 0, c_word: 0}
