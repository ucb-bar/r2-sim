# The Muon kernel registry (functional plane per FU kind, 2026-10-30;
# kernel 0 and the time sections, 2026-11-02).
#
# One entry per kernel. Kernel 0 (`opaque`) is listed: a task that writes
# nothing, whose argument block gives its time. The fields of an argument
# block are in order, in C layout with no implicit padding (each field
# starts where the one before it ends, at a multiple of its size), and the
# block is a multiple of 8 bytes. Addresses are global byte addresses; `ld`
# values are in elements. Element types: bf16 storage, fp32 arithmetic,
# round to nearest even at each bf16 store, unless the semantics say
# otherwise.
#
# `time` gives the traffic of a task from its block:
# - `ops`: the lane operations, the sum of the terms. A term is an
#   expression, or {expr, if: NAME} / {expr, unless: NAME}.
# - `latency`: the task's fixed latency in cycles, the sum of the terms (as
#   `ops`). It uses no resource: the task starts its work after it, as
#   after the Muon's `overhead`.
# - `reads`, `writes`: per entry {field, bytes, if?, unless?}: `bytes`
#   bytes read from (written to) the memory block that holds the address
#   in the u64 field `field`; `dst` (or an address of 0) is the base of the
#   task's destination range.
# - An expression is a sum (+) of products (*) of integer literals and the
#   u32 and u64 fields of the block. NAME is a flag of the kernel (a bit of
#   its field `flags`) or an integer field of the block (true when not 0).
# - An entry whose condition is false or whose bytes are 0 has no traffic.

- id: 0
  name: opaque
  summary: a task with a time and no data
  semantics: |
    Writes nothing. The block gives the time of the task: a fixed latency
    of latency cycles, then ops lane operations, bytes_in bytes read from
    src and bytes_out bytes written to the destination.
  fields:
    - [src, u64, "read: the address that the task reads; 0: the destination"]
    - [ops, u32, "the lane operations"]
    - [bytes_in, u32, "the bytes read from src"]
    - [bytes_out, u32, "the bytes written to the destination"]
    - [latency, u32, "the fixed latency in cycles (no resource); 0: none"]
  time:
    ops: [ops]
    latency: [latency]
    reads:
      - {field: src, bytes: bytes_in}
    writes:
      - {field: dst, bytes: bytes_out}

- id: 1
  name: row_stats
  summary: LayerNorm statistics of one chunk of the columns of each row
  semantics: |
    Per row, in fp32: the chunk's mean_c and M2_c (the mean, then the sum
    of squared differences from it). If count = 0: (mean, M2) = (mean_c,
    M2_c). Else the merge of Chan et al.: n = count + cols, d = mean_c -
    mean, mean += d * cols / n, M2 += M2_c + d * d * count * cols / n.
  fields:
    - [src, u64, "read: bf16 [rows][cols], leading dimension ld"]
    - [stats, u64, "read and write: fp32 [rows][2] (mean, M2)"]
    - [rows, u32, "the rows"]
    - [cols, u32, "the columns of the chunk"]
    - [ld, u32, "the leading dimension of src"]
    - [count, u32, "the elements per row merged before this chunk; 0 for the first chunk"]
  time:
    ops: [rows * cols * 4]
    reads:
      - {field: src, bytes: rows * cols * 2}
      - {field: stats, bytes: rows * 8, if: count}
    writes:
      - {field: stats, bytes: rows * 8}

- id: 2
  name: epilogue
  summary: one out tile of a GEMM, from C to the bf16 output
  semantics: |
    Per element, in fp32: y = c. With NORM: y = rstd * (y - mean * u[j]),
    rstd = 1 / sqrt(M2 / k + eps). With BIAS: y += bias[j]. With
    GELU_TANH: y = 0.5 * y * (1 + tanh(sqrt(2 / pi) * (y + 0.044715 *
    y^3))). With RES: y += res. Then out = bf16(y). An address that a flag
    needs and that is 0 is an error. NORM is a LayerNorm folded into the
    GEMM: W' = diag(gamma) W, u = the column sums of the stored W', and
    bias = beta W + b.
  flags:
    NORM: 1
    BIAS: 2
    RES: 4
    GELU_TANH: 8
    C_F32: 16
  fields:
    - [c, u64, "read: C [rows][cols], ld_c: bf16, or fp32 with C_F32"]
    - [out, u64, "write: bf16 [rows][cols], ld_out"]
    - [res, u64, "read: bf16 [rows][cols], ld_res; with RES"]
    - [bias, u64, "read: fp32 [cols]; with BIAS"]
    - [u, u64, "read: fp32 [cols], the column sums of W'; with NORM"]
    - [stats, u64, "read: fp32 [rows][2] (mean, M2); with NORM"]
    - [rows, u32, "the rows"]
    - [cols, u32, "the columns"]
    - [ld_c, u32, "the leading dimension of c"]
    - [ld_out, u32, "the leading dimension of out"]
    - [ld_res, u32, "the leading dimension of res"]
    - [k, u32, "the elements per row of the LayerNorm input; with NORM"]
    - [eps, f32, "the LayerNorm epsilon; with NORM"]
    - [flags, u32, "NORM, BIAS, RES, GELU_TANH, C_F32"]
  time:
    ops:
      - {expr: rows * cols, if: BIAS}
      - {expr: rows * cols, if: RES}
      - {expr: rows * cols * 2, if: NORM}
      - {expr: rows * cols * 8, if: GELU_TANH}
    reads:
      - {field: c, bytes: rows * cols * 2, unless: C_F32}
      - {field: c, bytes: rows * cols * 4, if: C_F32}
      - {field: res, bytes: rows * cols * 2, if: RES}
      - {field: bias, bytes: cols * 4, if: BIAS}
      - {field: u, bytes: cols * 4, if: NORM}
      - {field: stats, bytes: rows * 8, if: NORM}
    writes:
      - {field: out, bytes: rows * cols * 2}

- id: 3
  name: softmax_stats
  summary: the row maximum and sum of the attention scores over both halves
  semantics: |
    Per row, over both halves, in fp32: m = max(scale * s) and l = sum of
    exp(scale * s - m).
  fields:
    - [s0, u64, "read: bf16 [rows][cols], ld (half 0)"]
    - [s1, u64, "read: bf16 [rows][cols], ld (half 1)"]
    - [stats, u64, "write: fp32 [rows][2] (m, l)"]
    - [rows, u32, "the rows"]
    - [cols, u32, "the columns of one half"]
    - [ld, u32, "the leading dimension of s0 and s1"]
    - [scale, f32, "the attention scale"]
  time:
    ops: [rows * cols * 6]
    reads:
      - {field: s0, bytes: rows * cols * 2}
      - {field: s1, bytes: rows * cols * 2}
    writes:
      - {field: stats, bytes: rows * 8}

- id: 4
  name: softmax_apply
  summary: the probabilities of one half of the attention scores
  semantics: |
    Per element, in fp32: p = exp(scale * s - m) / l. Then dst = bf16(p).
  fields:
    - [src, u64, "read: bf16 [rows][cols], ld"]
    - [dst, u64, "write: bf16 [rows][cols], ld (may be src)"]
    - [stats, u64, "read: fp32 [rows][2] (m, l)"]
    - [rows, u32, "the rows"]
    - [cols, u32, "the columns"]
    - [ld, u32, "the leading dimension of src and dst"]
    - [scale, f32, "the same scale as softmax_stats"]
  time:
    ops: [rows * cols * 3]
    reads:
      - {field: src, bytes: rows * cols * 2}
      - {field: stats, bytes: rows * 8}
    writes:
      - {field: dst, bytes: rows * cols * 2}
