# Two SMs under one gpc under a device, for the hierarchy tests.
# Own spaces (offset_bits 24, fields gpc:2 sm:2):
#   root 0x000_0000, gpc0 0x400_0000, sm0 0x500_0000, sm1 0x600_0000
# The hand-computed tests on this file exclude descriptor assembly:
# every Neutrino has c_base, c_dep and c_word 0 (c_invoke only).

global:
  neutrino_granule: 512
  msg_bytes: 64
  # The hand computations of hierarchy.rs and remote_invoke.rs were derived
  # under the first co-charge rule; the control buses and bridges below run
  # at the data rate, so messages time as before.
  cocharge: longest
  address:
    fields: [{name: gpc, bits: 2}, {name: sm, bits: 2}]
    offset_bits: 24

device:
  name: root
  fabric:
    - {name: sbus}
    - {name: cbus, control: true}
  memory:
    - {name: hbm, type: dram, addr: [[0x0, 0x800000]], bw_bytes: 256, latency: 200, slave: $this.sbus}
  compute:
    # Copy engine: writes into HBM are its pulls (Section 3.3).
    - {name: dma, type: dma, latency: 100, inflight: 2, master: [$this.sbus]}
  neutrino: {c_base: 0, c_dep: 0, c_word: 0}
  children:
    - name: gpc0
      fabric:
        - {name: clsbus, bw_bytes: 64}
        - {name: clcbus, bw_bytes: 64, control: true}
        - {name: clsbus_to_sbus, topology: link, from: $this.clsbus, to: $parent.sbus, bw_bytes: 64, latency: 20}
        - {name: clcbus_to_cbus, topology: link, from: $this.clcbus, to: $parent.cbus, bw_bytes: 64, latency: 20, control: true}
      memory:
        - {name: sync, type: sync, addr: [[0xF00000, 0x1000000]]}
      neutrino: {c_base: 0, c_dep: 0, c_word: 0}
      children:
        - {name: sm0, config: two_sm_sm.yaml}
        - {name: sm1, config: two_sm_sm.yaml}
