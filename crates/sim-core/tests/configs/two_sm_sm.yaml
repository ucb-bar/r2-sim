# An SM of two_sm.yaml.
# The hand-computed tests on this file exclude descriptor assembly:
# every Neutrino has c_base, c_dep and c_word 0 (c_invoke only).
fabric:
  - {name: smsbus}
  - {name: smcbus, control: true}
  - {name: lbus}
  - {name: smsbus_to_clsbus, topology: link, from: $this.smsbus, to: $parent.clsbus, bw_bytes: 32, latency: 10}
  - {name: smcbus_to_clcbus, topology: link, from: $this.smcbus, to: $parent.clcbus, bw_bytes: 32, latency: 10, control: true}
memory:
  - {name: smem, type: scratch, addr: [[0x0, 0x80000]], bw_bytes: 128, latency: 10, slave: [$this.lbus, $this.smsbus]}
  - {name: sync, type: sync, addr: [[0xF00000, 0x1000000]]}
compute:
  - {name: atlas, type: tensor, rate: {bf16: 4096}, master: [$this.lbus]}
  - {name: dma, type: dma, latency: 100, inflight: 2, master: [$this.lbus, $this.smsbus]}
neutrino: {inbound_refs: 4, t_retry: 50, c_base: 0, c_dep: 0, c_word: 0}
